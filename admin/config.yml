backend:
  name: git-gateway
  branch: main

media_folder: uploads
public_folder: /uploads

locale: zh_Hant

collections:
  - name: works
    label: Works
    files:
      - name: works_list
        label: All Works
        file: data/works.json
        fields:
          - name: works
            label: Work List
            label_singular: Work
            widget: list
            summary: "{{fields.title}} - {{fields.category}}"
            fields:
              - name: title
                label: Title
                widget: string

              - name: subtitle
                label: Subtitle
                widget: string
                hint: "e.g. Wedding Editorial 2024"

              - name: category
                label: Category
                widget: select
                options:
                  - { label: Photography, value: photography }
                  - { label: Graphic Design, value: graphic }
                  - { label: Editorial, value: editorial }
                  - { label: Product, value: product }

              - name: image
                label: Image
                widget: image
                required: false
                hint: "Recommended width 1200px+, JPG or WebP."

              - name: description
                label: Description
                widget: text
                hint: "1-2 sentence description shown in the lightbox."

              - name: aspect
                label: Aspect Ratio (placeholder only)
                widget: number
                value_type: float
                min: 0.3
                max: 2.5
                step: 0.01
                default: 1.0
                hint: "Width divided by height. Portrait: 0.75, Square: 1.0, Landscape: 1.5. Ignored once image uploaded."
                required: false
