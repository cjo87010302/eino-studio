backend:
  name: git-gateway
  branch: main

site_url: https://eino26.netlify.app
display_url: https://eino26.netlify.app

media_folder: uploads
public_folder: /uploads

locale: zh_Hant

editor:
  preview: false

collections:
  - name: site
    label: 網站內容
    description: 網站上所有文字都在這裡改。點開一個區塊、修改、按上方「儲存」再「發佈」，約 1 分鐘後上線。
    files:
      - name: site_content
        label: 全站文字
        file: data/site.json
        fields:
          - name: site
            label: 全站 / SEO
            widget: object
            collapsed: true
            hint: 網頁標題、搜尋與分享時顯示的文字。
            fields:
              - { name: logo, label: Logo 文字, widget: string }
              - { name: title, label: 網頁標題（SEO）, widget: string, hint: "顯示在瀏覽器分頁與 Google 搜尋結果。" }
              - { name: description, label: 網站描述, widget: text, hint: "Google 搜尋結果下方的說明文字，建議 80 字以內。" }
              - { name: og_title, label: 分享標題（OG）, widget: string, hint: "分享到 LINE / FB / IG 時顯示的標題。" }
              - { name: og_description, label: 分享描述（OG）, widget: text }
              - { name: footer_copyright, label: 頁尾版權, widget: string }

          - name: hero
            label: 首屏區
            widget: object
            collapsed: true
            hint: 進站第一眼看到的大標題區。
            fields:
              - { name: tag, label: 上方標籤, widget: string }
              - { name: heading_line1, label: 主標第一行, widget: string }
              - { name: heading_line2, label: 主標第二行（斜體）, widget: string }
              - { name: description, label: 描述, widget: text }
              - { name: cta, label: 按鈕文字, widget: string }

          - name: about
            label: 關於區
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: 小標籤, widget: string }
              - { name: heading, label: 標題（用換行斷行）, widget: text }
              - { name: body1, label: 段落一, widget: text }
              - { name: body2, label: 段落二, widget: text }
              - { name: stat1_number, label: 數據一 - 數字, widget: string }
              - { name: stat1_label, label: 數據一 - 標籤, widget: string }
              - { name: stat2_number, label: 數據二 - 數字, widget: string }
              - { name: stat2_label, label: 數據二 - 標籤, widget: string }
              - { name: stat3_number, label: 數據三 - 數字, widget: string }
              - { name: stat3_label, label: 數據三 - 標籤, widget: string }

          - name: services
            label: 服務項目
            widget: list
            collapsed: true
            summary: "{{fields.number}} {{fields.title}}"
            fields:
              - { name: number, label: 編號（如 01）, widget: string }
              - { name: title, label: 服務名稱, widget: string }
              - { name: description, label: 描述, widget: text }
              - { name: tags, label: 標籤, widget: string }

          - name: contact
            label: 聯絡區
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: 標題（用換行斷行）, widget: text }
              - { name: email, label: 電子郵件, widget: string, hint: "顯示在網站上的聯絡信箱。" }
              - name: socials
                label: 社群連結
                widget: list
                collapsed: true
                summary: "{{fields.name}}（{{fields.handle}}）"
                fields:
                  - { name: name, label: 平台名稱, widget: string }
                  - { name: handle, label: 顯示帳號, widget: string }
                  - { name: url, label: 連結網址, widget: string, hint: "完整網址，例如 https://instagram.com/你的帳號" }

          - name: ui
            label: 介面文字（按鈕 / 標籤 / 導覽）
            widget: object
            collapsed: true
            hint: 導覽列、按鈕、表單欄位等固定介面用字。
            fields:
              - { name: nav_about, label: 導覽 - 關於, widget: string }
              - { name: nav_contact, label: 導覽 - 聯絡, widget: string }
              - { name: menu_works_label, label: 手機選單 - 作品標題, widget: string }
              - { name: cat_all, label: 分類 - 全部, widget: string }
              - { name: cat_photography, label: 分類 - 攝影, widget: string }
              - { name: cat_graphic, label: 分類 - 平面設計, widget: string }
              - { name: cat_editorial, label: 分類 - 編輯設計, widget: string }
              - { name: cat_product, label: 分類 - 產品, widget: string }
              - { name: filter_all, label: 篩選 - 全部作品, widget: string }
              - { name: works_title, label: 作品區標題（用換行斷行）, widget: text }
              - { name: works_label, label: 作品區 - 計數標籤, widget: string }
              - { name: services_title, label: 服務區標題, widget: string }
              - { name: contact_title, label: 聯絡區標題（用換行斷行）, widget: text }
              - { name: form_heading, label: 表單 - 標題, widget: string }
              - { name: form_name, label: 表單 - 姓名, widget: string }
              - { name: form_email, label: 表單 - 電子郵件, widget: string }
              - { name: form_service, label: 表單 - 服務項目, widget: string }
              - { name: form_budget, label: 表單 - 預算, widget: string }
              - { name: form_message, label: 表單 - 訊息, widget: string }
              - { name: form_submit, label: 表單 - 送出按鈕, widget: string }
              - { name: form_sending, label: 表單 - 傳送中文字, widget: string }
              - { name: form_sent, label: 表單 - 已送出按鈕文字, widget: string }
              - { name: form_success, label: 表單 - 成功訊息, widget: string, hint: "送出成功後顯示在按鈕下方的訊息。" }
              - { name: form_err_send, label: 錯誤訊息 - 送出失敗, widget: string }
              - { name: form_err_name, label: 錯誤訊息 - 姓名, widget: string }
              - { name: form_err_email, label: 錯誤訊息 - 電子郵件, widget: string }
              - { name: form_err_service, label: 錯誤訊息 - 服務項目, widget: string }
              - { name: form_err_message, label: 錯誤訊息 - 訊息, widget: string }
              - { name: footer_top, label: 頁尾 - 回到頂端, widget: string }
              - { name: lightbox_close, label: 燈箱 - 關閉, widget: string }
              - { name: lightbox_prev, label: 燈箱 - 上一個, widget: string }
              - { name: lightbox_next, label: 燈箱 - 下一個, widget: string }

  - name: works
    label: 作品
    description: 新增、排序、刪除作品。列表最上面的作品會同時當作首屏主圖。
    files:
      - name: works_list
        label: 所有作品
        file: data/works.json
        fields:
          - name: works
            label: 作品列表
            label_singular: 作品
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.title}}｜{{fields.subtitle}}"
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: subtitle, label: 副標題, widget: string, hint: "例如：婚禮編輯 · 2024" }
              - name: category
                label: 分類
                widget: select
                options:
                  - { label: 攝影, value: photography }
                  - { label: 平面設計, value: graphic }
                  - { label: 編輯設計, value: editorial }
                  - { label: 產品, value: product }
              - { name: image, label: 圖片, widget: image, required: false, hint: "建議寬度 1200px 以上，JPG 或 WebP。手機版會以滿版單欄顯示。" }
              - { name: description, label: 描述, widget: text, hint: "顯示在燈箱中的 1-2 句說明。" }
              - name: aspect
                label: 長寬比（僅佔位用）
                widget: number
                value_type: float
                min: 0.3
                max: 2.5
                step: 0.01
                default: 1.0
                hint: "寬除以高。直式：0.75，正方：1.0，橫式：1.5。上傳圖片後此值會被忽略。"
                required: false
